<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./ochantier-tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..600,0..1,0&display=block">
<style>.material-symbols-rounded{font-variation-settings:'FILL' 1,'wght' 500,'opsz' 24;user-select:none}@keyframes och-spin{to{transform:rotate(360deg)}}</style>
</helmet>
<div role="{{ role }}" style="display:flex;flex-direction:{{ dir }};align-items:center;gap:{{ gap }};text-align:{{ align }};padding:{{ pad }};border:1px {{ lineStyle }} {{ line }};border-radius:var(--radius-xl);background:{{ bg }};font-family:var(--font-sans);color:var(--c-ink)">
  <sc-if value="{{ isSpin }}"><span style="width:var(--icon-lg);height:var(--icon-lg);flex:none;border-radius:var(--radius-round);border:3px solid var(--c-primary-200);border-top-color:var(--c-primary);animation:och-spin .8s linear infinite"></span></sc-if>
  <sc-if value="{{ hasIcon }}"><span style="width:{{ tile }};height:{{ tile }};flex:none;border-radius:var(--radius-round);display:grid;place-items:center;background:{{ iconBg }}"><span class="material-symbols-rounded" style="font-size:{{ iconSize }};color:{{ iconFg }}">{{ icon }}</span></span></sc-if>
  <div style="flex:1;min-width:0">
    <div style="font-size:{{ titleFs }};font-weight:var(--fw-bold)">{{ title }}</div>
    <sc-if value="{{ hasText }}"><div style="margin-top:var(--space-1);font-size:var(--fs-sm);color:var(--c-muted);line-height:var(--lh-normal);text-wrap:pretty">{{ text }}</div></sc-if>
  </div>
  <sc-if value="{{ hasAction }}"><button onClick="{{ onAction }}" style="flex:none;height:var(--control-xs);padding:0 var(--space-3);border:1px solid var(--c-line-strong);border-radius:var(--radius-lg);background:var(--c-surface);font-family:var(--font-sans);font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--c-ink);cursor:pointer;white-space:nowrap" style-hover="border-color:var(--c-line-hover)">{{ actionLabel }}</button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:220},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;loading&quot;,&quot;empty&quot;,&quot;nodata&quot;,&quot;error&quot;,&quot;forbidden&quot;,&quot;success&quot;,&quot;partial&quot;,&quot;missing&quot;,&quot;expired&quot;],&quot;default&quot;:&quot;nodata&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, kind = p.kind || 'nodata', compact = !!p.compact;
    const K = {
      loading: ['', 'primary', 'Chargement…', 'Récupération des données en cours.'],
      empty: ['search_off', 'neutral', 'Aucun résultat', 'Aucun élément ne correspond à vos critères. Modifiez la recherche ou les filtres.'],
      nodata: ['inbox', 'neutral', 'Aucune donnée', 'Rien à afficher pour le moment.'],
      error: ['cloud_off', 'danger', 'Impossible de charger les données', 'Une erreur est survenue. Vérifiez votre connexion puis réessayez.'],
      forbidden: ['lock', 'purple', 'Accès restreint', 'Votre profil ne permet pas de consulter cette information.'],
      success: ['task_alt', 'success', 'Opération réussie', ''],
      partial: ['rule', 'warning', 'Données partielles', 'Certaines informations sont encore en cours de synchronisation.'],
      missing: ['upload_file', 'warning', 'Document KYC manquant', 'Aucun fichier n’a été déposé pour ce document.'],
      expired: ['event_busy', 'orange', 'Document KYC expiré', 'Une version à jour doit être demandée au promoteur.']
    }[kind] || [];
    const tone = K[1] || 'neutral';
    const tinted = ['error', 'success', 'partial', 'missing', 'expired', 'forbidden'].includes(kind);
    const inline = compact || ['partial', 'success', 'expired', 'missing'].includes(kind) && p.inline !== false && compact;
    return {
      role: kind === 'error' || kind === 'forbidden' ? 'alert' : 'status',
      dir: compact ? 'row' : 'column', align: compact ? 'left' : 'center', gap: compact ? 'var(--space-3)' : 'var(--space-2)',
      pad: compact ? 'var(--space-3) var(--space-4)' : 'var(--space-8) var(--space-5)',
      bg: tinted ? `var(--c-${tone}-bg)` : 'var(--c-surface)',
      line: tinted ? 'transparent' : 'var(--c-line-strong)', lineStyle: tinted ? 'solid' : 'dashed',
      isSpin: kind === 'loading', hasIcon: kind !== 'loading',
      icon: p.icon || K[0], iconBg: tinted ? 'var(--c-surface)' : `var(--c-${tone}-bg)`, iconFg: `var(--c-${tone}-fg)`,
      tile: compact ? 'var(--control-sm)' : 'var(--control-lg)', iconSize: compact ? 'var(--icon-sm)' : 'var(--icon-md)',
      title: p.title || K[2], titleFs: compact ? 'var(--fs-md)' : 'var(--fs-lg)',
      text: p.text ?? K[3], hasText: !!(p.text ?? K[3]),
      actionLabel: p.actionLabel, hasAction: !!p.actionLabel, onAction: p.onAction
    };
  }
}
</script>
</body>
</html>
