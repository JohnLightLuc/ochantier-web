<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./ochantier-tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..600,0..1,0&display=block">
<style>.material-symbols-rounded{font-variation-settings:'FILL' 1,'wght' 500,'opsz' 24;user-select:none}</style>
</helmet>
<span style="display:inline-flex;align-items:center;gap:var(--space-1);height:26px;padding:0 var(--space-2_5);border-radius:var(--radius-sm);background:{{ bg }};color:{{ fg }};font-family:var(--font-sans);font-size:var(--fs-sm);font-weight:var(--fw-semibold);white-space:nowrap;line-height:1"><sc-if value="{{ hasIcon }}"><span class="material-symbols-rounded" style="font-size:var(--icon-xs)">{{ icon }}</span></sc-if>{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:60},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;En cours&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;success&quot;,&quot;warning&quot;,&quot;orange&quot;,&quot;danger&quot;,&quot;danger-solid&quot;,&quot;info&quot;,&quot;purple&quot;,&quot;neutral&quot;],&quot;default&quot;:&quot;success&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const alias = { g: 'success', a: 'warning', o: 'orange', r: 'danger', b: 'info', p: 'purple', n: 'neutral', R: 'danger-solid' };
    const t = alias[p.tone] || p.tone || 'neutral';
    const solid = t === 'danger-solid';
    const base = solid ? 'danger' : t;
    return {
      label: p.label, icon: p.icon, hasIcon: !!p.icon,
      bg: solid ? 'var(--c-danger)' : `var(--c-${base}-bg)`,
      fg: solid ? 'var(--c-on-dark)' : `var(--c-${base}-fg)`
    };
  }
}
</script>
</body>
</html>
