<button type="{{ type }}" onClick="{{ onClick }}" disabled="{{ disabled }}" style="display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:{{ h }};padding:0 {{ px }};width:{{ w }};border-radius:var(--radius-lg);border:1px solid {{ border }};background:{{ bg }};color:{{ fg }};font-family:var(--font-sans);font-size:{{ fs }};font-weight:var(--fw-semibold);white-space:nowrap;cursor:{{ cursor }};opacity:{{ op }};box-shadow:{{ shadow }};transition:background var(--dur-fast),border-color var(--dur-fast),filter var(--dur-fast)" style-hover="filter:brightness(.95)" style-focus="outline:none;box-shadow:var(--ring-focus)">
  <sc-if value="{{ hasIcon }}"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">{{ icon }}</span></sc-if>
  <sc-if value="{{ hasLabel }}"><span>{{ label }}</span></sc-if>
  <sc-if value="{{ hasIconRight }}"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">{{ iconRight }}</span></sc-if>
</button>
