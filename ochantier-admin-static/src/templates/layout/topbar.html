    <header data-component="Topbar" style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--space-4) var(--space-6)">
      <div style="flex:1 1 360px;min-width:0">
                <sc-if value="{{ hasCrumbs }}">
          <nav aria-label="Fil d’Ariane" style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1_5);margin-bottom:var(--space-1_5);font-size:var(--fs-md)">
            <sc-for list="{{ crumbs }}" as="b">
              <sc-if value="{{ b.hasSep }}"><span style="color:var(--c-subtle)">/</span></sc-if>
              <sc-if value="{{ b.isLink }}"><button onClick="{{ b.go }}" style="border:0;background:transparent;padding:0;color:var(--c-primary-600);font-weight:var(--fw-semibold);cursor:pointer" style-hover="text-decoration:underline">{{ b.label }}</button></sc-if>
              <sc-if value="{{ b.isCur }}"><span aria-current="page" style="color:var(--c-muted)">{{ b.label }}</span></sc-if>
            </sc-for>
          </nav>
        </sc-if>        <h1 style="margin:0;font-weight:var(--fw-bold);font-size:var(--fs-4xl);line-height:1.15;letter-spacing:-.5px;color:{{ titleC }}">{{ title }}</h1>
        <p style="margin:var(--space-1) 0 0;font-size:var(--fs-lg);color:{{ subtitleC }};text-wrap:pretty">{{ subtitle }}</p>
      </div>
      <div style="display:flex;align-items:center;gap:var(--space-2_5);position:relative">
        <button onClick="{{ openSearch }}" aria-label="Recherche globale (⌘ K)" aria-haspopup="dialog" style="display:flex;align-items:center;gap:var(--space-2);height:var(--control-md);width:var(--search-w);max-width:36vw;padding:0 var(--space-2) 0 var(--space-3);border:1px solid var(--c-line);border-radius:var(--radius-lg);background:var(--c-surface);cursor:text;text-align:left" style-hover="border-color:var(--c-line-hover)">
          <span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-muted)">search</span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-md);color:var(--c-muted)">Rechercher un chantier, un ouvrier, un promoteur…</span>
          <kbd style="flex:none;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--c-muted);border:1px solid var(--c-line-strong);border-bottom-width:2px;border-radius:var(--radius-sm);padding:1px var(--space-1_5);background:var(--c-surface-2)">⌘ K</kbd>
        </button>
        <button onClick="{{ toggleNotif }}" aria-label="Notifications" aria-expanded="{{ notifOpen }}" style="position:relative;width:42px;height:42px;border:0;border-radius:var(--radius-lg);background:transparent;cursor:pointer;display:grid;place-items:center" style-hover="background:var(--c-hover)"><span class="material-symbols-rounded" style="font-size:var(--icon-md);color:var(--c-ink);font-variation-settings:'FILL' 0">notifications</span><sc-if value="{{ hasUnread }}"><span style="position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:var(--radius-md);background:var(--c-danger);color:var(--c-surface);font-size:var(--fs-2xs);font-weight:var(--fw-bold);display:grid;place-items:center;border:2px solid var(--c-bg)">{{ unread }}</span></sc-if></button>
        <button onClick="{{ openHelp }}" aria-label="Aide" style="width:42px;height:42px;border:0;border-radius:var(--radius-lg);background:transparent;cursor:pointer;display:grid;place-items:center" style-hover="background:var(--c-hover)"><span class="material-symbols-rounded" style="font-size:var(--icon-md);color:var(--c-ink);font-variation-settings:'FILL' 0">help</span></button>
        <button onClick="{{ toggleMenu }}" aria-label="Menu du profil" aria-expanded="{{ menuOpen }}" style="display:flex;align-items:center;gap:var(--space-1_5);border:0;background:transparent;cursor:pointer;padding:var(--space-0_5);border-radius:var(--radius-pill)" style-hover="background:var(--c-hover)">
          <span style="width:42px;height:42px;border-radius:var(--radius-round);background:var(--c-primary);color:var(--c-surface);font-weight:var(--fw-bold);display:grid;place-items:center">NY</span>
          <span class="material-symbols-rounded" style="font-size:var(--icon-md);color:var(--c-ink)">expand_more</span>
        </button>
        <sc-if value="{{ notifOpen }}">
          <div onClick="{{ closeMenus }}" style="position:fixed;inset:0;z-index:25"></div>
          <div data-component="NotificationPanel" role="dialog" aria-label="Notifications" style="position:absolute;right:0;top:52px;z-index:30;width:var(--notif-w);max-width:90vw;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-xl);box-shadow:var(--shadow-popover);overflow:hidden;display:flex;flex-direction:column">
            <div style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4) var(--space-2)"><b style="font-size:var(--fs-lg);flex:1">Notifications</b><button onClick="{{ nt.markAll }}" disabled="{{ nt.noUnread }}" style="border:0;background:transparent;padding:0;color:{{ nt.markC }};font-weight:var(--fw-semibold);cursor:{{ nt.markCur }};font-size:var(--fs-sm)">Tout marquer comme lu</button></div>
            <div role="tablist" style="display:flex;gap:var(--space-1);padding:0 var(--space-4);border-bottom:1px solid var(--c-line)">
              <sc-for list="{{ nt.tabs }}" as="t"><button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.go }}" style="display:flex;align-items:center;gap:var(--space-1_5);height:var(--control-sm);padding:0 var(--space-2_5);border:0;border-bottom:2.5px solid {{ t.line }};margin-bottom:-1px;background:transparent;cursor:pointer;font-weight:var(--fw-semibold);font-size:var(--fs-md);color:{{ t.fg }}">{{ t.label }}<span style="font-size:var(--fs-xs);color:var(--c-muted)">{{ t.count }}</span></button></sc-for>
            </div>
            <div style="max-height:400px;overflow-y:auto">
              <sc-if value="{{ nt.loading }}"><div style="display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4)"><sc-for list="{{ nt.skel }}" as="x"><div style="height:52px;border-radius:var(--radius-md);background:linear-gradient(90deg,var(--c-surface-3) 25%,var(--c-line-soft) 50%,var(--c-surface-3) 75%);background-size:200% 100%;animation:och-shimmer 1.2s linear infinite"></div></sc-for></div></sc-if>
              <sc-if value="{{ nt.error }}"><div style="padding:var(--space-3)"><dc-import name="StateBlock" kind="error" compact="{{ true }}" title="Notifications indisponibles" text="Connexion au serveur perdue." action-label="Réessayer" on-action="{{ nt.retry }}" hint-size="100%,64px"></dc-import></div></sc-if>
              <sc-if value="{{ nt.empty }}"><div style="padding:var(--space-3)"><dc-import name="StateBlock" kind="nodata" compact="{{ true }}" icon="notifications_off" title="{{ nt.emptyTitle }}" text="{{ nt.emptyText }}" hint-size="100%,64px"></dc-import></div></sc-if>
              <sc-if value="{{ nt.hasItems }}">
                <sc-for list="{{ nt.items }}" as="n">
                  <button onClick="{{ n.go }}" style="width:100%;display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);border:0;border-bottom:1px solid var(--c-line-soft);background:{{ n.bg }};cursor:pointer;text-align:left" style-hover="background:var(--c-surface-2)">
                    <span style="width:var(--control-xs);height:var(--control-xs);border-radius:var(--radius-round);flex:none;display:grid;place-items:center;background:{{ n.iBg }}"><span class="material-symbols-rounded" style="font-size:var(--icon-xs);color:{{ n.iFg }}">{{ n.icon }}</span></span>
                    <span style="flex:1;min-width:0"><span style="display:block;font-size:var(--fs-md);font-weight:{{ n.fw }}">{{ n.t }}</span><span style="display:block;font-size:var(--fs-sm);color:var(--c-muted)">{{ n.d }}</span><span style="display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-1)"><dc-import name="StatusBadge" label="{{ n.prio }}" tone="{{ n.ptn }}" icon="" hint-size="60px,24px"></dc-import><span style="font-size:var(--fs-xs);color:var(--c-muted)">{{ n.when }}</span></span></span>
                    <sc-if value="{{ n.unread }}"><span style="width:8px;height:8px;margin-top:var(--space-1_5);border-radius:var(--radius-round);background:var(--c-primary-500);flex:none"></span></sc-if>
                  </button>
                </sc-for>
              </sc-if>
            </div>
            <div style="padding:var(--space-2_5);border-top:1px solid var(--c-line-soft);text-align:center"><button onClick="{{ nt.seeAll }}" style="border:0;background:transparent;padding:0;color:var(--c-primary-600);font-weight:var(--fw-semibold);cursor:pointer;font-size:var(--fs-sm);text-decoration:underline;text-underline-offset:2px">Voir toutes les notifications</button></div>
          </div>
        </sc-if>
        <sc-if value="{{ menuOpen }}">
          <div onClick="{{ closeMenus }}" style="position:fixed;inset:0;z-index:25"></div>
          <div role="menu" data-component="ProfileMenu" style="position:absolute;right:0;top:52px;z-index:30;width:250px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-xl);box-shadow:var(--shadow-popover);padding:var(--space-1_5)">
            <div style="display:flex;align-items:center;gap:var(--space-2_5);padding:var(--space-2_5) var(--space-3) var(--space-3);border-bottom:1px solid var(--c-line-soft);margin-bottom:var(--space-1)"><span style="width:var(--avatar-md);height:var(--avatar-md);border-radius:var(--radius-round);background:var(--c-primary);color:var(--c-surface);font-weight:var(--fw-bold);font-size:var(--fs-sm);display:grid;place-items:center;flex:none">NY</span><div style="min-width:0"><div style="font-weight:var(--fw-bold)">N. Yao</div><div style="font-size:var(--fs-sm);color:var(--c-muted)">Super administrateur</div></div></div>
            <sc-for list="{{ profileItems }}" as="i">
              <sc-if value="{{ i.sep }}"><div style="height:1px;background:var(--c-line-soft);margin:var(--space-1) 0"></div></sc-if>
              <button role="menuitem" onClick="{{ i.go }}" style="width:100%;display:flex;align-items:center;gap:var(--space-2_5);padding:var(--space-2) var(--space-3);border:0;background:transparent;border-radius:var(--radius-md);cursor:pointer;text-align:left;color:{{ i.color }}" style-hover="background:var(--c-surface-3)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:{{ i.iconC }}">{{ i.icon }}</span>{{ i.label }}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </header>
