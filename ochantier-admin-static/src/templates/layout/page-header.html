    <sc-if value="{{ hasActions }}">
      <div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-2_5);margin-top:-6px">
        <sc-if value="{{ hasPeriod }}">
          <button style="display:flex;align-items:center;gap:var(--space-2_5);height:var(--control-md);padding:0 var(--space-3);border:1px solid var(--c-line-strong);border-radius:var(--radius-lg);background:var(--c-surface);cursor:pointer;font-weight:var(--fw-semibold)" style-hover="border-color:var(--c-line-hover)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-primary-600)">calendar_month</span>{{ period }}<span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-muted)">expand_more</span></button>
        </sc-if>
        <sc-for list="{{ actions }}" as="a" hint-placeholder-count="2"><dc-import name="Button" label="{{ a.label }}" icon="{{ a.icon }}" variant="{{ a.variant }}" onClick="{{ a.go }}" hint-size="170px,44px"></dc-import></sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ isRapports }}">
      <div style="display:flex;flex-wrap:wrap;gap:var(--space-3)">
        <sc-for list="{{ rep.filters }}" as="f" hint-placeholder-count="3">
          <label style="position:relative;flex:1 1 240px;max-width:340px;display:flex;align-items:center;gap:var(--space-2_5);height:var(--control-md);padding:0 var(--space-3);border:1px solid {{ f.bd }};border-radius:var(--radius-lg);background:{{ f.bg }};cursor:pointer;font-weight:var(--fw-medium)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-ink)">{{ f.icon }}</span><span style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ f.label }}</span><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-muted)">expand_more</span><select aria-label="{{ f.aria }}" value="{{ f.value }}" onChange="{{ f.onChange }}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer"><sc-for list="{{ f.options }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select></label>
        </sc-for>
      </div>
      <sc-if value="{{ rep.isSub }}">
        <nav aria-label="Rapports" style="display:flex;flex-wrap:wrap;gap:var(--space-2)"><sc-for list="{{ rep.nav }}" as="n" hint-placeholder-count="6"><button onClick="{{ n.go }}" style="display:flex;align-items:center;gap:var(--space-2);height:var(--control-sm);padding:0 var(--space-3);border:1px solid {{ n.bd }};border-radius:var(--radius-round);background:{{ n.bg }};color:{{ n.fg }};font-weight:var(--fw-semibold);font-size:var(--fs-sm);cursor:pointer"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">{{ n.icon }}</span>{{ n.label }}</button></sc-for></nav>
      </sc-if>
    </sc-if>

    <sc-if value="{{ hasKpis }}" hint-placeholder-val="{{ true }}">
      <div data-component="StatGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--space-4)">
        <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="4"><dc-import name="StatCard" label="{{ k.label }}" value="{{ k.value }}" unit="{{ k.unit }}" icon="{{ k.icon }}" tone="{{ k.tn }}" delta="{{ k.delta }}" delta-tone="{{ k.dtn }}" compare="{{ k.cmp }}" hint="{{ k.hint }}" highlight="{{ k.highlight }}" hint-size="100%,116px"></dc-import></sc-for>
      </div>
    </sc-if>
