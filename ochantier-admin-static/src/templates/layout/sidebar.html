  <aside data-component="Sidebar" style="width:{{ sideW }};flex:none;position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--c-sidebar-top) 0%,var(--c-sidebar-bottom) 100%);color:var(--c-surface);display:flex;flex-direction:column;padding:var(--space-5) var(--space-3) var(--space-5);transition:width .2s ease;overflow:hidden">
    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:center;padding:var(--space-1) 0 var(--space-6)">
        <div style="font-weight:var(--fw-black);font-size:var(--fs-logo);line-height:1;letter-spacing:-.5px;white-space:nowrap"><span style="color:var(--c-accent)">O’</span><span style="color:var(--c-brand-green)">CHANTIER</span></div>
        <div style="font-weight:var(--fw-semibold);font-size:var(--fs-xs);letter-spacing:.45em;margin-top:var(--space-1_5);padding-left:.45em">ADMIN</div>
      </div>
    </sc-if>
    <sc-if value="{{ collapsed }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center;font-weight:var(--fw-black);font-size:var(--fs-4xl);line-height:1;color:var(--c-accent);padding:var(--space-1) 0 var(--space-8)">O’</div>
    </sc-if>
    <nav style="display:flex;flex-direction:column;gap:var(--space-0_5);flex:1;overflow-y:auto">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="13">
        <button onClick="{{ n.go }}" aria-current="{{ n.current }}" title="{{ n.label }}" style="flex:none;display:flex;align-items:center;gap:var(--space-3);height:var(--control-md);padding:0 var(--space-3);border:0;border-radius:var(--radius-lg);background:{{ n.bg }};color:var(--c-surface);cursor:pointer;text-align:left;font-size:var(--fs-base);font-weight:{{ n.fw }};white-space:nowrap;box-shadow:{{ n.shadow }}" style-hover="background:var(--c-on-dark-hover)">
          <span class="material-symbols-rounded" style="font-size:var(--icon-md);flex:none;color:{{ n.iconC }}">{{ n.icon }}</span>
          <sc-if value="{{ n.showLabel }}"><span style="flex:1">{{ n.label }}</span></sc-if>
          <sc-if value="{{ n.hasBadge }}"><span style="min-width:22px;height:20px;padding:0 var(--space-1_5);border-radius:var(--radius-lg);background:var(--c-accent);color:var(--c-primary-strong);font-size:var(--fs-xs);font-weight:var(--fw-bold);display:grid;place-items:center">{{ n.badge }}</span></sc-if>
        </button>
      </sc-for>
    </nav>
    <sc-if value="{{ showTagline }}" hint-placeholder-val="{{ true }}">
      <div style="padding:var(--space-4) var(--space-3) var(--space-1_5)"><div style="width:56px;height:2px;background:var(--c-accent);margin-bottom:var(--space-4)"></div><div style="font-size:var(--fs-md);letter-spacing:.2em;line-height:1.6;color:var(--c-on-dark-muted)">Des talents<br>pour bâtir demain</div></div>
    </sc-if>
    <button onClick="{{ toggleSide }}" title="Réduire / déployer le menu" style="margin-top:var(--space-2_5);height:var(--control-sm);border:1px solid var(--c-on-dark-line);border-radius:var(--radius-md);background:transparent;color:var(--c-on-dark-muted);cursor:pointer;display:grid;place-items:center" style-hover="background:var(--c-on-dark-hover)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">{{ sideIcon }}</span></button>
  </aside>
