    <sc-if value="{{ gs.open }}">
      <div data-component="GlobalSearch" onClick="{{ gs.close }}" style="position:fixed;inset:0;z-index:55;background:var(--c-scrim);display:flex;justify-content:center;align-items:flex-start;padding:10vh var(--space-6) var(--space-6)">
        <div role="dialog" aria-modal="true" aria-label="Recherche globale" onClick="{{ gs.stop }}" style="width:100%;max-width:var(--search-modal-w);max-height:76vh;display:flex;flex-direction:column;background:var(--c-surface);border-radius:var(--radius-2xl);box-shadow:var(--shadow-modal);overflow:hidden;animation:och-rise var(--dur) var(--ease)">
          <div style="display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4);height:60px;border-bottom:1px solid var(--c-line)">
            <span class="material-symbols-rounded" style="font-size:var(--icon-md);color:var(--c-primary)">search</span>
            <input autoFocus="{{ true }}" value="{{ gs.q }}" onChange="{{ gs.onQ }}" onKeyDown="{{ gs.onKey }}" placeholder="Rechercher un chantier, un ouvrier, un promoteur…" aria-label="Rechercher" style="flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:var(--fs-lg);font-family:var(--font-sans);color:var(--c-ink)">
            <sc-if value="{{ gs.hasQ }}"><button onClick="{{ gs.clear }}" aria-label="Effacer la recherche" style="width:var(--control-xs);height:var(--control-xs);border:0;border-radius:var(--radius-md);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--c-muted)" style-hover="background:var(--c-hover)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">close</span></button></sc-if>
            <kbd style="flex:none;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--c-muted);border:1px solid var(--c-line-strong);border-bottom-width:2px;border-radius:var(--radius-sm);padding:1px var(--space-1_5);background:var(--c-surface-2)">Échap</kbd>
          </div>
          <div style="display:flex;gap:var(--space-1_5);flex-wrap:wrap;padding:var(--space-2_5) var(--space-4);border-bottom:1px solid var(--c-line-soft)">
            <sc-for list="{{ gs.cats }}" as="c"><button onClick="{{ c.go }}" aria-pressed="{{ c.on }}" style="display:flex;align-items:center;gap:var(--space-1);height:28px;padding:0 var(--space-3);border-radius:var(--radius-pill);border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font-weight:var(--fw-semibold);font-size:var(--fs-sm);cursor:pointer">{{ c.label }}<sc-if value="{{ c.hasCount }}"><span style="font-size:var(--fs-xs);opacity:.8">{{ c.count }}</span></sc-if></button></sc-for>
          </div>
          <div style="flex:1;overflow-y:auto;padding:var(--space-3) var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)">
            <sc-if value="{{ gs.loading }}"><dc-import name="StateBlock" kind="loading" compact="{{ true }}" title="Recherche en cours…" text="" hint-size="100%,64px"></dc-import></sc-if>
            <sc-if value="{{ gs.error }}"><dc-import name="StateBlock" kind="error" compact="{{ true }}" title="Recherche indisponible" text="La connexion au serveur est interrompue." action-label="Réessayer" on-action="{{ gs.retry }}" hint-size="100%,64px"></dc-import></sc-if>
            <sc-if value="{{ gs.empty }}"><dc-import name="StateBlock" kind="empty" title="{{ gs.emptyTitle }}" text="Vérifiez l’orthographe ou essayez un nom de chantier, d’ouvrier, de promoteur, une référence de paiement…" hint-size="100%,180px"></dc-import></sc-if>
            <sc-if value="{{ gs.showHome }}">
              <sc-if value="{{ gs.hasHist }}">
                <div>
                  <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)"><span style="flex:1;font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--c-muted);text-transform:uppercase;letter-spacing:.06em">Historique de recherche</span><button onClick="{{ gs.clearHist }}" style="border:0;background:transparent;padding:0;color:var(--c-primary-600);font-weight:var(--fw-semibold);font-size:var(--fs-sm);cursor:pointer">Effacer l’historique</button></div>
                  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2)"><sc-for list="{{ gs.hist }}" as="h"><span style="display:inline-flex;align-items:center;height:30px;border-radius:var(--radius-pill);border:1px solid var(--c-line-strong);background:var(--c-surface)"><button onClick="{{ h.go }}" style="display:flex;align-items:center;gap:var(--space-1);height:100%;padding:0 var(--space-1) 0 var(--space-2_5);border:0;background:transparent;cursor:pointer;font-size:var(--fs-sm);color:var(--c-ink-2)"><span class="material-symbols-rounded" style="font-size:var(--icon-xs);color:var(--c-muted)">history</span>{{ h.label }}</button><button onClick="{{ h.remove }}" aria-label="{{ h.aria }}" style="display:grid;place-items:center;width:26px;height:100%;border:0;background:transparent;cursor:pointer;color:var(--c-muted)"><span class="material-symbols-rounded" style="font-size:var(--icon-xs)">close</span></button></span></sc-for></div>
                </div>
              </sc-if>
              <div>
                <div style="font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--c-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--space-1)">Résultats récents</div>
                <sc-for list="{{ gs.recent }}" as="it"><button onClick="{{ it.go }}" style="width:100%;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-2_5);border:0;border-radius:var(--radius-lg);background:transparent;cursor:pointer;text-align:left" style-hover="background:var(--c-surface-3)"><span style="width:var(--control-sm);height:var(--control-sm);flex:none;border-radius:var(--radius-md);display:grid;place-items:center;background:var(--c-primary-50)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-primary-600)">{{ it.icon }}</span></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:var(--fw-semibold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.title }}</span><span style="display:block;font-size:var(--fs-sm);color:var(--c-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.sub }}</span></span><span style="font-size:var(--fs-xs);color:var(--c-muted);flex:none">{{ it.cat }}</span><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-subtle)">arrow_forward</span></button></sc-for>
                <sc-if value="{{ gs.noRecent }}"><div style="font-size:var(--fs-md);color:var(--c-muted);padding:var(--space-2) 0">Les éléments que vous consultez apparaîtront ici.</div></sc-if>
              </div>
            </sc-if>
            <sc-if value="{{ gs.hasResults }}">
              <sc-for list="{{ gs.groups }}" as="g">
                <div>
                  <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1)"><span style="font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--c-muted);text-transform:uppercase;letter-spacing:.06em">{{ g.label }}</span><span style="font-size:var(--fs-xs);color:var(--c-muted)">{{ g.count }}</span></div>
                  <sc-for list="{{ g.items }}" as="it"><button onClick="{{ it.go }}" style="width:100%;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-2_5);border:0;border-radius:var(--radius-lg);background:{{ it.bg }};cursor:pointer;text-align:left" style-hover="background:var(--c-surface-3)"><span style="width:var(--control-sm);height:var(--control-sm);flex:none;border-radius:var(--radius-md);display:grid;place-items:center;background:var(--c-primary-50)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-primary-600)">{{ it.icon }}</span></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:var(--fw-semibold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.title }}</span><span style="display:block;font-size:var(--fs-sm);color:var(--c-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.sub }}</span></span><sc-if value="{{ it.first }}"><kbd style="flex:none;font-family:var(--font-sans);font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--c-muted);border:1px solid var(--c-line-strong);border-bottom-width:2px;border-radius:var(--radius-sm);padding:1px var(--space-1_5);background:var(--c-surface)">↵</kbd></sc-if><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-subtle)">arrow_forward</span></button></sc-for>
                </div>
              </sc-for>
            </sc-if>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);padding:var(--space-2_5) var(--space-4);border-top:1px solid var(--c-line-soft);background:var(--c-surface-2);font-size:var(--fs-xs);color:var(--c-muted)"><span>↵ ouvrir le premier résultat</span><span>Échap fermer</span><span>⌘ K ouvrir / fermer la recherche</span></div>
        </div>
      </div>
    </sc-if>
