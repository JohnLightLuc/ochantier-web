  <sc-if value="{{ mo.open }}">
      <div data-component="ModalHost" role="dialog" aria-modal="true" aria-label="{{ mo.title }}" style="position:fixed;inset:0;z-index:50;background:var(--c-scrim);display:grid;place-items:center;padding:var(--space-6);overflow-y:auto">
        <div style="width:100%;max-width:{{ mo.width }};background:var(--c-surface);border-radius:var(--radius-2xl);box-shadow:var(--shadow-modal);padding:var(--space-6)">
          <div style="display:flex;gap:var(--space-4);align-items:flex-start">
            <span style="width:var(--control-md);height:var(--control-md);border-radius:var(--radius-round);flex:none;display:grid;place-items:center;background:{{ mo.iconBg }}"><span class="material-symbols-rounded" style="font-size:var(--icon-md);color:{{ mo.iconFg }}">{{ mo.icon }}</span></span>
            <div style="flex:1;min-width:0"><h3 style="margin:0;font-size:var(--fs-2xl);font-weight:var(--fw-bold)">{{ mo.title }}</h3><sc-if value="{{ mo.hasBody }}"><p style="margin:var(--space-2) 0 0;font-size:var(--fs-base);color:var(--c-muted);line-height:var(--lh-normal)">{{ mo.body }}</p></sc-if></div>
          </div>
          <sc-if value="{{ mo.hasReason }}">
            <div style="margin-top:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)">
              <sc-if value="{{ mo.hasMotifs }}"><label style="display:block"><span style="display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);margin-bottom:var(--space-1_5)">Catégorie</span><select value="{{ mo.motif }}" onChange="{{ mo.onMotif }}" style="width:100%;height:var(--control-md);padding:0 var(--space-3);border:1.5px solid var(--c-line-strong);border-radius:var(--radius-lg);background:var(--c-surface);font-size:var(--fs-base)"><sc-for list="{{ mo.motifs }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select></label></sc-if>
              <label style="display:block"><span style="display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);margin-bottom:var(--space-1_5)">{{ mo.reasonLabel }}</span><textarea value="{{ mo.reason }}" onChange="{{ mo.onReason }}" rows="3" maxLength="500" placeholder="Précisez le motif (visible dans l’historique et communiqué au promoteur)." style="width:100%;padding:var(--space-2_5) var(--space-3);border:1.5px solid {{ mo.reasonBorder }};border-radius:var(--radius-lg);font-size:var(--fs-base);font-family:var(--font-sans);resize:vertical;outline:0"></textarea><span style="display:flex;justify-content:space-between;gap:var(--space-2);margin-top:var(--space-1);font-size:var(--fs-sm)"><span style="color:var(--c-danger-fg)">{{ mo.reasonErr }}</span><span style="color:var(--c-muted)">{{ mo.reasonCount }}</span></span></label>
            </div>
          </sc-if>
          <sc-if value="{{ mo.hasNotif }}">
            <div style="margin-top:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)">
              <div style="font-size:var(--fs-md);color:var(--c-muted)">Destinataire : <b style="color:var(--c-ink)">{{ mo.recipient }}</b></div>
              <div><span style="display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);margin-bottom:var(--space-1_5)">Canaux *</span><div style="display:flex;flex-wrap:wrap;gap:var(--space-2)"><sc-for list="{{ mo.canals }}" as="c"><button onClick="{{ c.toggle }}" type="button" style="display:flex;align-items:center;gap:var(--space-1_5);height:var(--control-sm);padding:0 var(--space-3);border:1.5px solid {{ c.border }};border-radius:var(--radius-lg);background:{{ c.bg }};cursor:pointer;font-weight:var(--fw-semibold)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-primary)">{{ c.icon }}</span>{{ c.label }}</button></sc-for></div><span style="display:block;margin-top:var(--space-1);font-size:var(--fs-sm);color:var(--c-danger-fg)">{{ mo.canalErr }}</span></div>
              <label style="display:block"><span style="display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);margin-bottom:var(--space-1_5)">Objet *</span><input value="{{ mo.objet }}" onChange="{{ mo.onObjet }}" placeholder="Ex. Document KYC à mettre à jour" style="width:100%;height:var(--control-md);padding:0 var(--space-3);border:1.5px solid {{ mo.objetBorder }};border-radius:var(--radius-lg);font-size:var(--fs-base);outline:0"><span style="display:block;margin-top:var(--space-1);font-size:var(--fs-sm);color:var(--c-danger-fg)">{{ mo.objetErr }}</span></label>
              <label style="display:block"><span style="display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);margin-bottom:var(--space-1_5)">Message *</span><textarea value="{{ mo.message }}" onChange="{{ mo.onMessage }}" rows="4" placeholder="Votre message…" style="width:100%;padding:var(--space-2_5) var(--space-3);border:1.5px solid {{ mo.messageBorder }};border-radius:var(--radius-lg);font-size:var(--fs-base);font-family:var(--font-sans);resize:vertical;outline:0"></textarea><span style="display:block;margin-top:var(--space-1);font-size:var(--fs-sm);color:var(--c-danger-fg)">{{ mo.messageErr }}</span></label>
            </div>
          </sc-if>
          <sc-if value="{{ mo.hasFields }}">
            <div style="margin-top:var(--space-5);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)">
              <sc-for list="{{ mo.fields }}" as="f">
                <div role="group" style="grid-column:{{ f.col }};min-width:0">
                  <span style="display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);margin-bottom:var(--space-1_5)">{{ f.label }}<sc-if value="{{ f.req }}"><span style="color:var(--c-danger-fg)"> *</span></sc-if></span>
                  <sc-if value="{{ f.isText }}"><input type="{{ f.inputType }}" value="{{ f.value }}" onChange="{{ f.onChange }}" placeholder="{{ f.ph }}" aria-label="{{ f.label }}" aria-invalid="{{ f.hasErr }}" style="width:100%;height:var(--control-md);padding:0 var(--space-3);border:1.5px solid {{ f.border }};border-radius:var(--radius-lg);font-size:var(--fs-base);font-family:var(--font-sans);outline:0;background:var(--c-surface)" style-focus="border-color:var(--c-primary);box-shadow:var(--ring-focus)"></sc-if>
                  <sc-if value="{{ f.isSelect }}"><select value="{{ f.value }}" onChange="{{ f.onChange }}" aria-label="{{ f.label }}" aria-invalid="{{ f.hasErr }}" style="width:100%;height:var(--control-md);padding:0 var(--space-3);border:1.5px solid {{ f.border }};border-radius:var(--radius-lg);background:var(--c-surface);font-size:var(--fs-base);font-family:var(--font-sans)"><sc-for list="{{ f.options }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select></sc-if>
                  <sc-if value="{{ f.isArea }}"><textarea value="{{ f.value }}" onChange="{{ f.onChange }}" placeholder="{{ f.ph }}" aria-label="{{ f.label }}" rows="3" style="width:100%;padding:var(--space-2_5) var(--space-3);border:1.5px solid {{ f.border }};border-radius:var(--radius-lg);font-size:var(--fs-base);font-family:var(--font-sans);resize:vertical;outline:0"></textarea></sc-if>
                  <sc-if value="{{ f.isLines }}"><div style="display:flex;flex-direction:column;gap:var(--space-2)">
                    <sc-for list="{{ f.lines }}" as="ln"><div style="display:flex;align-items:center;gap:var(--space-2)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-brand-green);flex:none">check</span><input value="{{ ln.v }}" onChange="{{ ln.onChange }}" placeholder="{{ ln.ph }}" aria-label="{{ ln.aria }}" style="flex:1;min-width:0;height:var(--control-md);padding:0 var(--space-3);border:1.5px solid {{ f.border }};border-radius:var(--radius-lg);font-size:var(--fs-base);font-family:var(--font-sans);outline:0" style-focus="border-color:var(--c-primary)"></input><button type="button" onClick="{{ ln.up }}" title="Monter" aria-label="Monter la ligne" style="width:32px;height:32px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--c-muted);cursor:pointer;display:grid;place-items:center;opacity:{{ ln.upOp }}" style-hover="background:var(--c-surface-3)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">arrow_upward</span></button><button type="button" onClick="{{ ln.del }}" title="Supprimer la ligne" aria-label="Supprimer la ligne" style="width:32px;height:32px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--c-danger-fg);cursor:pointer;display:grid;place-items:center" style-hover="background:var(--c-danger-bg)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">close</span></button></div></sc-for>
                    <button type="button" onClick="{{ f.addLine }}" style="align-self:flex-start;display:flex;align-items:center;gap:var(--space-1_5);height:var(--control-sm);padding:0 var(--space-3);border:1.5px dashed var(--c-line-hover);border-radius:var(--radius-lg);background:var(--c-surface);color:var(--c-primary-600);font-weight:var(--fw-semibold);cursor:pointer" style-hover="border-color:var(--c-primary-400);background:var(--c-primary-50)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">add</span>Ajouter un avantage</button>
                  </div></sc-if>
                  <sc-if value="{{ f.isFile }}"><label style="position:relative;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border:1.5px dashed {{ f.border }};border-radius:var(--radius-lg);background:var(--c-surface-2);cursor:pointer"><span class="material-symbols-rounded" style="font-size:var(--icon-md);color:var(--c-primary-600)">cloud_upload</span><span style="flex:1;min-width:0;font-size:var(--fs-md);font-weight:var(--fw-semibold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ f.fileLabel }}</span><input type="file" onChange="{{ f.onFile }}" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label></sc-if>
                  <sc-if value="{{ f.hasHint }}"><span style="display:block;margin-top:var(--space-1);font-size:var(--fs-sm);color:var(--c-muted)">{{ f.hint }}</span></sc-if>
                  <sc-if value="{{ f.hasErr }}"><span role="alert" style="display:block;margin-top:var(--space-1);font-size:var(--fs-sm);color:var(--c-danger-fg)">{{ f.err }}</span></sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ mo.hasDoc }}">
            <div style="margin-top:var(--space-5);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-3)">
              <label style="display:block;grid-column:1 / -1"><span style="display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);margin-bottom:var(--space-1_5)">Type de document *</span><select value="{{ mo.docType }}" onChange="{{ mo.onDocType }}" style="width:100%;height:var(--control-md);padding:0 var(--space-3);border:1.5px solid var(--c-line-strong);border-radius:var(--radius-lg);background:var(--c-surface);font-size:var(--fs-base)"><sc-for list="{{ mo.docTypes }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select></label>
              <label style="display:block"><span style="display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);margin-bottom:var(--space-1_5)">N° / référence *</span><input value="{{ mo.ref }}" onChange="{{ mo.onRef }}" placeholder="Ex. AF-2026-00871" style="width:100%;height:var(--control-md);padding:0 var(--space-3);border:1.5px solid {{ mo.refBorder }};border-radius:var(--radius-lg);font-size:var(--fs-base);outline:0"><span style="display:block;margin-top:var(--space-1);font-size:var(--fs-sm);color:var(--c-danger-fg)">{{ mo.refErr }}</span></label>
              <label style="display:block"><span style="display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);margin-bottom:var(--space-1_5)">Date d’expiration</span><input type="date" value="{{ mo.exp }}" onChange="{{ mo.onExp }}" style="width:100%;height:var(--control-md);padding:0 var(--space-3);border:1.5px solid var(--c-line-strong);border-radius:var(--radius-lg);font-size:var(--fs-base);outline:0"></label>
              <label style="grid-column:1 / -1;position:relative;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4);border:1.5px dashed {{ mo.fileBorder }};border-radius:var(--radius-xl);background:var(--c-surface-2);cursor:pointer"><span class="material-symbols-rounded" style="font-size:var(--icon-lg);color:var(--c-primary-600)">cloud_upload</span><span style="flex:1;min-width:0"><b style="display:block;font-size:var(--fs-md)">{{ mo.fileLabel }}</b><span style="font-size:var(--fs-sm);color:var(--c-muted)">PDF, JPG ou PNG · 10 Mo maximum</span></span><input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange="{{ mo.onFile }}" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
              <span style="grid-column:1 / -1;font-size:var(--fs-sm);color:var(--c-danger-fg)">{{ mo.fileErr }}</span>
            </div>
          </sc-if>
          <div style="display:flex;justify-content:flex-end;flex-wrap:wrap;gap:var(--space-2_5);margin-top:var(--space-6)">
            <sc-if value="{{ mo.hasAlt }}"><dc-import name="Button" label="{{ mo.altLabel }}" variant="ghost" onClick="{{ mo.doAlt }}" hint-size="200px,44px"></dc-import></sc-if>
            <dc-import name="Button" label="{{ mo.cancel }}" variant="secondary" onClick="{{ mo.doCancel }}" hint-size="100px,44px"></dc-import>
            <dc-import name="Button" label="{{ mo.ok }}" icon="{{ mo.okIcon }}" variant="{{ mo.okVariant }}" onClick="{{ mo.doOk }}" hint-size="140px,44px"></dc-import>
          </div>
        </div>
      </div>
    </sc-if>
