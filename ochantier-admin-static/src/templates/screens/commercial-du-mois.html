    <sc-if value="{{ hasCotm }}">
      <section data-component="CommercialOfTheMonthCard" style="display:flex;flex-wrap:wrap;gap:var(--space-5);align-items:center;padding:var(--space-5);border-radius:var(--radius-2xl);background:var(--c-warning-surface);border:1px solid var(--c-warning-line)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;width:100%"><div style="display:flex;align-items:center;gap:var(--space-2_5)"><span class="material-symbols-rounded" style="font-size:var(--icon-lg);color:var(--c-accent-600)">emoji_events</span><div><h2 style="margin:0;font-size:var(--fs-2xl);font-weight:var(--fw-bold)">Commercial du mois</h2><div style="font-size:var(--fs-sm);color:var(--c-muted)">{{ cotm.monthL }}</div></div></div><div style="display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap"><div role="tablist" style="display:flex;border:1px solid var(--c-line-strong);border-radius:var(--radius-md);overflow:hidden"><sc-for list="{{ cotm.ranges }}" as="r"><button role="tab" aria-selected="{{ r.on }}" onClick="{{ r.go }}" style="height:var(--control-sm);padding:0 var(--space-3);border:0;background:{{ r.bg }};color:{{ r.fg }};font-weight:var(--fw-semibold);font-size:var(--fs-sm);cursor:pointer">{{ r.label }}</button></sc-for></div><select value="{{ cotm.month }}" onChange="{{ cotm.onMonth }}" aria-label="Choisir un mois" style="height:var(--control-sm);padding:0 var(--space-2);border:1px solid var(--c-line-strong);border-radius:var(--radius-md);background:var(--c-surface);font-size:var(--fs-sm);font-family:var(--font-sans)"><sc-for list="{{ cotm.months }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select></div></div>
        <sc-if value="{{ cotm.none }}"><dc-import name="StateBlock" kind="nodata" icon="emoji_events" title="Aucun commercial éligible" text="Aucun commercial actif n’a été classé sur cette période." compact="{{ true }}" hint-size="100%,64px"></dc-import></sc-if>
        <sc-if value="{{ cotm.has }}">
          <div style="display:flex;align-items:center;gap:var(--space-4);flex:1 1 320px;min-width:0"><span style="position:relative;flex:none"><dc-import name="Avatar" full-name="{{ cotm.name }}" size="lg" hint-size="72px,72px"></dc-import><span style="position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:var(--radius-round);display:grid;place-items:center;background:var(--c-accent);color:var(--c-primary-strong);font-weight:var(--fw-bold);font-size:var(--fs-sm);border:2px solid var(--c-surface)">1</span></span><div style="min-width:0"><div style="display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap"><b style="font-size:var(--fs-2xl)">{{ cotm.name }}</b><span style="display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2_5);border-radius:var(--radius-pill);background:var(--c-accent);color:var(--c-primary-strong);font-size:var(--fs-xs);font-weight:var(--fw-bold)"><span class="material-symbols-rounded" style="font-size:var(--icon-xs)">workspace_premium</span>Commercial du mois</span></div><div style="font-size:var(--fs-md);color:var(--c-muted)">{{ cotm.code }} · {{ cotm.zone }}</div><div style="display:flex;align-items:center;gap:var(--space-1);margin-top:var(--space-1);font-size:var(--fs-sm);font-weight:var(--fw-bold);color:{{ cotm.evoC }}"><span class="material-symbols-rounded" style="font-size:var(--icon-xs)">{{ cotm.evoIcon }}</span>{{ cotm.evo }}</div></div></div>
          <div style="display:flex;flex-direction:column;align-items:center;padding:var(--space-3) var(--space-5);border-radius:var(--radius-xl);background:var(--c-surface);border:1px solid var(--c-warning-line)"><span style="font-size:var(--fs-sm);color:var(--c-muted)">Score global</span><b style="font-size:var(--fs-5xl);line-height:1;color:var(--c-ink)">{{ cotm.score }}</b><span style="font-size:var(--fs-xs);color:var(--c-muted)">sur 100 · rang 1</span></div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--space-2);flex:2 1 420px"><sc-for list="{{ cotm.stats }}" as="t"><div style="padding:var(--space-2_5) var(--space-3);border-radius:var(--radius-lg);background:var(--c-surface);border:1px solid var(--c-line)"><div style="font-size:var(--fs-xs);color:var(--c-muted)">{{ t.l }}</div><b style="font-size:var(--fs-lg);white-space:nowrap">{{ t.v }}</b></div></sc-for></div>
          <div style="display:flex;flex-direction:column;gap:var(--space-2)"><dc-import name="Button" label="Voir le profil" icon="open_in_new" variant="primary" onClick="{{ cotm.go }}" hint-size="160px,44px"></dc-import><dc-import name="Button" label="Voir le classement" icon="leaderboard" variant="secondary" onClick="{{ cotm.goRank }}" hint-size="180px,44px"></dc-import></div>
        </sc-if>
      </section>
    </sc-if>
