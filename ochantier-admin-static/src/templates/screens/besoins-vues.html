    <sc-if value="{{ hasBoViews }}">
      <div data-component="StatGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--space-4)"><sc-for list="{{ bov.kpis }}" as="k" hint-placeholder-count="4"><button onClick="{{ k.go }}" aria-label="{{ k.label }}" style="display:block;min-width:0;padding:0;border:0;background:transparent;text-align:left;border-radius:var(--radius-2xl);cursor:pointer;font:inherit;color:inherit" style-hover="box-shadow:var(--shadow-md)"><dc-import name="StatCard" label="{{ k.label }}" value="{{ k.value }}" icon="{{ k.icon }}" tone="{{ k.tn }}" hint="{{ k.hint }}" highlight="{{ k.highlight }}" hint-size="100%,110px"></dc-import></button></sc-for></div>
      <div data-component="BesoinsViews" style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap"><div role="group" aria-label="Filtres rapides" style="display:flex;flex-wrap:wrap;gap:var(--space-2)"><sc-for list="{{ bov.chips }}" as="q" hint-placeholder-count="4"><button onClick="{{ q.go }}" aria-pressed="{{ q.on }}" style="display:inline-flex;align-items:center;gap:var(--space-1_5);height:var(--control-sm);padding:0 var(--space-2) 0 var(--space-3);border:1px solid {{ q.border }};border-radius:var(--radius-pill);background:{{ q.bg }};color:{{ q.fg }};font-weight:var(--fw-semibold);font-size:var(--fs-sm);cursor:pointer;font-family:var(--font-sans)" style-hover="border-color:var(--c-line-hover)"><span class="material-symbols-rounded" style="font-size:var(--icon-xs)">{{ q.icon }}</span>{{ q.label }}<span style="min-width:22px;height:20px;padding:0 6px;border-radius:var(--radius-pill);background:{{ q.nBg }};color:{{ q.nFg }};display:inline-grid;place-items:center;font-size:var(--fs-xs)">{{ q.n }}</span></button></sc-for></div><div role="tablist" aria-label="Mode d’affichage" style="display:flex;border:1px solid var(--c-line-strong);border-radius:var(--radius-md);overflow:hidden"><sc-for list="{{ bov.views }}" as="v"><button role="tab" aria-selected="{{ v.on }}" onClick="{{ v.go }}" style="display:flex;align-items:center;gap:var(--space-1_5);height:var(--control-sm);padding:0 var(--space-3);border:0;background:{{ v.bg }};color:{{ v.fg }};font-weight:var(--fw-semibold);font-size:var(--fs-sm);cursor:pointer"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">{{ v.icon }}</span>{{ v.label }}</button></sc-for></div><sc-if value="{{ bov.hasActive }}"><span style="display:inline-flex;align-items:center;gap:var(--space-1);height:28px;padding:0 var(--space-2) 0 var(--space-3);border-radius:var(--radius-pill);background:var(--c-primary-50);border:1px solid var(--c-primary-200);color:var(--c-primary);font-size:var(--fs-sm);font-weight:var(--fw-semibold)">{{ bov.activeLabel }}<button onClick="{{ bov.clear }}" aria-label="Retirer le filtre" style="border:0;background:transparent;padding:0;color:inherit;cursor:pointer;display:grid;place-items:center"><span class="material-symbols-rounded" style="font-size:var(--icon-xs)">close</span></button></span></sc-if><span style="flex:1"></span><span style="display:flex;align-items:center;gap:var(--space-1_5);font-size:var(--fs-sm);color:var(--c-muted)"><span class="material-symbols-rounded" style="font-size:var(--icon-xs)">tune</span>{{ bov.rulesNote }}</span></div>
      <sc-if value="{{ bov.isCards }}"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--space-4)"><sc-for list="{{ bov.cards }}" as="c"><button onClick="{{ c.go }}" style="display:flex;flex-direction:column;gap:var(--space-1_5);padding:var(--space-4);border:1px solid var(--c-line);border-radius:var(--radius-2xl);background:var(--c-surface);cursor:pointer;text-align:left;font-family:var(--font-sans)" style-hover="box-shadow:var(--shadow-md)"><span style="display:flex;align-items:center;gap:var(--space-2)"><b style="flex:1;min-width:0;font-size:var(--fs-lg);color:var(--c-ink)">{{ c.name }}</b><dc-import name="StatusBadge" label="{{ c.st }}" tone="{{ c.tn }}" icon="" hint-size="90px,26px"></dc-import></span><span style="font-size:var(--fs-sm);color:var(--c-muted)">{{ c.ref }} · {{ c.promo }} · {{ c.loc }}</span><span style="font-size:var(--fs-sm);color:var(--c-ink-2)">{{ c.line }}</span><span style="display:flex;align-items:center;gap:var(--space-2)"><span style="flex:1;height:7px;border-radius:var(--radius-pill);background:var(--c-line-soft);overflow:hidden"><span style="display:block;height:100%;width:{{ c.w }};background:{{ c.barC }}"></span></span><b style="font-size:var(--fs-sm)">{{ c.pct }}</b></span><span style="display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap"><dc-import name="StatusBadge" label="{{ c.b2 }}" tone="{{ c.b2tn }}" icon="" hint-size="90px,26px"></dc-import><span style="font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:{{ c.alertC }}">{{ c.alert }}</span></span></button></sc-for></div><sc-if value="{{ bov.noCards }}"><dc-import name="StateBlock" kind="empty" title="Aucun résultat" text="Aucun élément ne correspond à la recherche ou aux filtres." hint-size="100%,180px"></dc-import></sc-if></sc-if>
    </sc-if>
