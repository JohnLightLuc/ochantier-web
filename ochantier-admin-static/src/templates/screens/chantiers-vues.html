    <sc-if value="{{ hasChViews }}">
      <div data-component="StatGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--space-4)"><sc-for list="{{ chv.kpis }}" as="k"><button onClick="{{ k.go }}" aria-label="{{ k.label }}" style="display:block;min-width:0;padding:0;border:0;background:transparent;text-align:left;border-radius:var(--radius-2xl);cursor:pointer;font:inherit;color:inherit" style-hover="box-shadow:var(--shadow-md)"><dc-import name="StatCard" label="{{ k.label }}" value="{{ k.value }}" icon="{{ k.icon }}" tone="{{ k.tn }}" hint="{{ k.hint }}" highlight="{{ k.highlight }}" hint-size="100%,110px"></dc-import></button></sc-for></div>
      <div data-component="ChantierViews" style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap"><div role="tablist" aria-label="Mode d’affichage" style="display:flex;border:1px solid var(--c-line-strong);border-radius:var(--radius-md);overflow:hidden"><sc-for list="{{ chv.views }}" as="v"><button role="tab" aria-selected="{{ v.on }}" onClick="{{ v.go }}" style="display:flex;align-items:center;gap:var(--space-1_5);height:var(--control-sm);padding:0 var(--space-3);border:0;background:{{ v.bg }};color:{{ v.fg }};font-weight:var(--fw-semibold);font-size:var(--fs-sm);cursor:pointer"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">{{ v.icon }}</span>{{ v.label }}</button></sc-for></div><sc-if value="{{ chv.hasActive }}"><span style="display:inline-flex;align-items:center;gap:var(--space-1);height:28px;padding:0 var(--space-2) 0 var(--space-3);border-radius:var(--radius-pill);background:var(--c-primary-50);border:1px solid var(--c-primary-200);color:var(--c-primary);font-size:var(--fs-sm);font-weight:var(--fw-semibold)">{{ chv.activeLabel }}<button onClick="{{ chv.clear }}" aria-label="Retirer le filtre" style="border:0;background:transparent;padding:0;color:inherit;cursor:pointer;display:grid;place-items:center"><span class="material-symbols-rounded" style="font-size:var(--icon-xs)">close</span></button></span></sc-if></div>
      <sc-if value="{{ chv.isCards }}"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--space-4)"><sc-for list="{{ chv.cards }}" as="c"><button onClick="{{ c.go }}" style="display:flex;flex-direction:column;gap:var(--space-2);padding:0 0 var(--space-4);border:1px solid var(--c-line);border-radius:var(--radius-2xl);background:var(--c-surface);cursor:pointer;text-align:left;overflow:hidden;font-family:var(--font-sans)" style-hover="box-shadow:var(--shadow-md)"><span style="display:grid;place-items:center;height:120px;background:repeating-linear-gradient(135deg,var(--c-surface-3) 0 12px,var(--c-surface-2) 12px 24px);font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-xs);color:var(--c-muted)">photo du chantier</span><span style="display:flex;flex-direction:column;gap:var(--space-1_5);padding:0 var(--space-4)"><span style="display:flex;align-items:center;gap:var(--space-2)"><b style="flex:1;min-width:0;font-size:var(--fs-lg);color:var(--c-ink)">{{ c.name }}</b><dc-import name="StatusBadge" label="{{ c.st }}" tone="{{ c.tn }}" icon="" hint-size="90px,26px"></dc-import></span><span style="font-size:var(--fs-sm);color:var(--c-muted)">{{ c.promo }} · {{ c.loc }}</span><span style="font-size:var(--fs-sm);color:var(--c-ink-2)">{{ c.dates }} · {{ c.eff }}</span><span style="display:flex;align-items:center;gap:var(--space-2)"><span style="flex:1;height:7px;border-radius:var(--radius-pill);background:var(--c-line-soft);overflow:hidden"><span style="display:block;height:100%;width:{{ c.w }};background:{{ c.barC }}"></span></span><b style="font-size:var(--fs-sm)">{{ c.pct }}</b></span><span style="font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:{{ c.alertC }}">{{ c.alert }}</span></span></button></sc-for></div><sc-if value="{{ chv.noCards }}"><dc-import name="StateBlock" kind="empty" title="Aucun chantier" text="Aucun chantier ne correspond à ce filtre." hint-size="100%,180px"></dc-import></sc-if></sc-if>
      <sc-if value="{{ chv.isCal }}"><div style="background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-2xl);padding:var(--space-4)"><div style="display:flex;align-items:center;gap:var(--space-2_5);margin-bottom:var(--space-3)"><dc-import name="Button" icon="chevron_left" size="sm" variant="secondary" onClick="{{ chv.cal.prev }}" hint-size="32px,32px"></dc-import><b style="font-size:var(--fs-xl);min-width:170px;text-align:center">{{ chv.cal.title }}</b><dc-import name="Button" icon="chevron_right" size="sm" variant="secondary" onClick="{{ chv.cal.next }}" hint-size="32px,32px"></dc-import></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-1_5)"><sc-for list="{{ chv.cal.dows }}" as="d"><div style="font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--c-muted);text-transform:uppercase;text-align:center">{{ d }}</div></sc-for><sc-for list="{{ chv.cal.days }}" as="d"><div style="min-height:96px;padding:var(--space-1_5);border-radius:var(--radius-md);border:1.5px solid {{ d.border }};opacity:{{ d.op }};display:flex;flex-direction:column;gap:3px;min-width:0"><b style="font-size:var(--fs-sm)">{{ d.n }}</b><sc-for list="{{ d.ev }}" as="e"><button onClick="{{ e.go }}" title="{{ e.t }}" style="display:flex;align-items:center;gap:4px;border:0;background:var(--c-surface-2);border-radius:var(--radius-xs);padding:2px 4px;cursor:pointer;font-size:var(--fs-2xs);text-align:left;min-width:0;font-family:var(--font-sans)"><span style="width:6px;height:6px;flex:none;border-radius:var(--radius-round);background:{{ e.c }}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ e.t }}</span></button></sc-for><sc-if value="{{ d.hasMore }}"><span style="font-size:var(--fs-2xs);color:var(--c-muted)">{{ d.more }}</span></sc-if></div></sc-for></div><div style="display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);margin-top:var(--space-3)"><sc-for list="{{ chv.cal.legend }}" as="l"><span style="display:flex;align-items:center;gap:var(--space-1_5);font-size:var(--fs-sm)"><span style="width:10px;height:10px;border-radius:var(--radius-round);background:{{ l.c }}"></span>{{ l.l }}</span></sc-for></div></div></sc-if>
      <sc-if value="{{ chv.isMap }}"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--space-4)"><div style="grid-column:span 2;min-width:0;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-2xl);padding:var(--space-4)"><div style="font-size:var(--fs-sm);color:var(--c-muted);margin-bottom:var(--space-2)">Carte schématique du district d’Abidjan · positions approximatives</div><div style="position:relative;height:440px;border-radius:var(--radius-xl);background:var(--c-info-bg);border:1px solid var(--c-line);overflow:hidden"><sc-for list="{{ chv.map.communes }}" as="m"><span style="position:absolute;left:{{ m.left }};top:{{ m.top }};transform:translate(-50%,-50%);font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--c-info-fg);opacity:.7;pointer-events:none">{{ m.l }}</span></sc-for><sc-for list="{{ chv.map.pins }}" as="p"><button onClick="{{ p.go }}" title="{{ p.name }}" aria-label="{{ p.name }}" style="position:absolute;left:{{ p.left }};top:{{ p.top }};width:18px;height:18px;margin:-9px 0 0 -9px;padding:0;border-radius:var(--radius-round);background:{{ p.c }};border:3px solid var(--c-surface);box-shadow:{{ p.ring }};cursor:pointer"></button></sc-for><sc-if value="{{ chv.map.hasSel }}"><div style="position:absolute;left:var(--space-3);bottom:var(--space-3);right:var(--space-3);max-width:420px;display:flex;flex-direction:column;gap:var(--space-1_5);padding:var(--space-3);border-radius:var(--radius-lg);background:var(--c-surface);box-shadow:var(--shadow-popover)"><div style="display:flex;align-items:center;gap:var(--space-2)"><b style="flex:1">{{ chv.map.sel.name }}</b><dc-import name="StatusBadge" label="{{ chv.map.sel.st }}" tone="{{ chv.map.sel.tn }}" icon="" hint-size="90px,26px"></dc-import><button onClick="{{ chv.map.sel.close }}" aria-label="Fermer" style="border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--c-muted)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">close</span></button></div><span style="font-size:var(--fs-sm);color:var(--c-muted)">{{ chv.map.sel.sub }}</span><span style="font-size:var(--fs-sm)">{{ chv.map.sel.line }}</span><div><dc-import name="Button" label="Ouvrir la fiche" icon="open_in_new" size="sm" variant="primary" onClick="{{ chv.map.sel.go }}" hint-size="140px,32px"></dc-import></div></div></sc-if></div><div style="display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);margin-top:var(--space-2)"><sc-for list="{{ chv.map.legend }}" as="l"><span style="display:flex;align-items:center;gap:var(--space-1_5);font-size:var(--fs-sm)"><span style="width:10px;height:10px;border-radius:var(--radius-round);background:{{ l.c }}"></span>{{ l.l }}</span></sc-for></div></div><div style="background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-2xl);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)"><h3 style="margin:0;font-size:var(--fs-xl)">Regroupement par zone</h3><sc-for list="{{ chv.map.zones }}" as="z"><button onClick="{{ z.go }}" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-2_5);border:1px solid var(--c-line);border-radius:var(--radius-md);background:var(--c-surface);cursor:pointer;font-family:var(--font-sans);text-align:left" style-hover="background:var(--c-surface-2)"><span class="material-symbols-rounded" style="font-size:var(--icon-sm);color:var(--c-primary-600)">location_on</span><span style="flex:1">{{ z.l }}</span><b>{{ z.n }}</b></button></sc-for><sc-if value="{{ chv.map.hasOutside }}"><div style="font-size:var(--fs-sm);color:var(--c-muted);margin-top:var(--space-2)">Hors du district d’Abidjan</div><sc-for list="{{ chv.map.outside }}" as="o"><button onClick="{{ o.go }}" style="border:0;background:transparent;padding:0;text-align:left;color:var(--c-primary-600);font-weight:var(--fw-semibold);cursor:pointer;font-size:var(--fs-sm)">{{ o.name }}</button></sc-for></sc-if></div></div></sc-if>
    </sc-if>
