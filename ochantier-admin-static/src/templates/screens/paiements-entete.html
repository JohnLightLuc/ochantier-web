        <sc-if value="{{ hasPyTop }}">
    <div data-component="PaymentsOverview" style="display:flex;flex-direction:column;gap:var(--space-4);margin-bottom:var(--space-4)">
      <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center"><span style="font-size:var(--fs-sm);font-weight:var(--fw-bold);color:var(--c-ink-2);margin-right:var(--space-1)">À traiter</span><sc-for list="{{ pyTop.todo }}" as="d"><button onClick="{{ d.go }}" style="display:inline-flex;align-items:center;gap:var(--space-1_5);height:var(--control-sm);padding:0 var(--space-3);border:1px solid {{ d.bd }};border-radius:var(--radius-pill);background:{{ d.bg }};color:{{ d.fg }};font-weight:var(--fw-semibold);font-size:var(--fs-sm);cursor:pointer;font-family:var(--font-sans)"><span class="material-symbols-rounded" style="font-size:var(--icon-xs)">{{ d.icon }}</span>{{ d.l }}<b>{{ d.n }}</b></button></sc-for></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:var(--space-4)"><sc-for list="{{ pyTop.groups }}" as="g" hint-placeholder-count="3"><section style="background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-2xl);padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);min-width:0"><header style="display:flex;align-items:center;gap:var(--space-2_5)"><span style="width:36px;height:36px;border-radius:var(--radius-lg);display:grid;place-items:center;flex:none;background:{{ g.bg }};color:{{ g.fg }}"><span class="material-symbols-rounded" style="font-size:var(--icon-sm)">{{ g.icon }}</span></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:var(--fw-bold);font-size:var(--fs-md)">{{ g.title }}</span><span style="display:block;font-size:var(--fs-xs);color:var(--c-muted)">{{ g.sub }}</span></span></header><div style="display:flex;align-items:baseline;gap:var(--space-1_5);flex-wrap:wrap"><b style="font-size:var(--fs-xl);font-variant-numeric:tabular-nums">{{ g.total }}</b><span style="font-size:var(--fs-sm);color:var(--c-muted);font-weight:var(--fw-semibold)">FCFA {{ g.totalLabel }}</span></div><div style="display:flex;flex-direction:column;border-top:1px solid var(--c-line);padding-top:var(--space-2)"><sc-for list="{{ g.rows }}" as="r"><button onClick="{{ r.go }}" style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2);border:0;border-radius:var(--radius-md);background:{{ r.bg }};cursor:pointer;font:inherit;color:inherit;text-align:left" style-hover="background:var(--c-surface-3)"><span style="width:8px;height:8px;border-radius:50%;background:{{ r.dot }};flex:none"></span><span style="flex:1;min-width:0;font-size:var(--fs-sm);color:var(--c-ink-2);font-weight:{{ r.fw }}">{{ r.l }} <span style="color:var(--c-muted);font-weight:400">· {{ r.n }}</span></span><b style="font-size:var(--fs-sm);font-variant-numeric:tabular-nums;white-space:nowrap">{{ r.v }}</b></button></sc-for></div></section></sc-for></div>
      <section style="background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-2xl);padding:var(--space-4) var(--space-5);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:var(--space-5)"><sc-for list="{{ pyTop.bars }}" as="b"><div style="display:flex;flex-direction:column;gap:var(--space-2_5);min-width:0"><div style="display:flex;align-items:baseline;gap:var(--space-2);flex-wrap:wrap"><b style="font-size:var(--fs-md)">{{ b.title }}</b><span style="font-size:var(--fs-sm);color:var(--c-muted)">{{ b.sub }}</span><span style="flex:1"></span><b style="font-variant-numeric:tabular-nums">{{ b.total }}</b></div><div role="img" aria-label="{{ b.title }}" style="display:flex;height:14px;border-radius:var(--radius-pill);overflow:hidden;background:var(--c-surface-3);gap:2px"><sc-for list="{{ b.segs }}" as="x"><span title="{{ x.tip }}" style="height:100%;width:{{ x.w }};background:{{ x.c }}"></span></sc-for></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:var(--space-2) var(--space-4)"><sc-for list="{{ b.legend }}" as="x"><div style="display:flex;align-items:flex-start;gap:var(--space-2);min-width:0"><span style="width:10px;height:10px;border-radius:3px;margin-top:4px;background:{{ x.c }};flex:none"></span><span style="min-width:0"><span style="display:block;font-size:var(--fs-xs);color:var(--c-muted)">{{ x.l }}</span><b style="font-size:var(--fs-sm);font-variant-numeric:tabular-nums">{{ x.v }}</b> <span style="font-size:var(--fs-xs);color:var(--c-muted)">{{ x.pct }}</span></span></div></sc-for></div></div></sc-for></section>
    </div>
        </sc-if>
